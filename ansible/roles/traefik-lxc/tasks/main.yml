---
- name: Ensure traefik directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
    owner: root
    group: root
  loop:
    - "{{ traefik_conf_d }}"
    - "{{ traefik_ssl_dir }}"
    - "{{ traefik_log_dir }}"

- name: Template Traefik static config
  ansible.builtin.template:
    src: traefik.yaml.j2
    dest: "{{ traefik_config_dir }}/traefik.yaml"
    mode: '0640'
    owner: root
    group: root
  register: traefik_static

- name: Template Traefik dynamic config (middlewares)
  ansible.builtin.template:
    src: dynamic.yaml.j2
    dest: "{{ traefik_conf_d }}/dynamic.yaml"
    mode: '0640'
    owner: root
    group: root
  register: traefik_dynamic

- name: Template Traefik internal routes
  ansible.builtin.template:
    src: internal.yaml.j2
    dest: "{{ traefik_conf_d }}/internal.yaml"
    mode: '0640'
    owner: root
    group: root
  register: traefik_internal

- name: Template Traefik docker container routes
  ansible.builtin.template:
    src: docker-routes.yaml.j2
    dest: "{{ traefik_conf_d }}/docker-routes.yaml"
    mode: '0640'
    owner: root
    group: root
  register: traefik_docker_routes

- name: Template Traefik systemd service
  ansible.builtin.template:
    src: traefik.service.j2
    dest: /etc/systemd/system/traefik.service
    mode: '0644'
    owner: root
    group: root
  register: traefik_service

- name: Reload systemd if service changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: traefik_service.changed

- name: Ensure Traefik service is enabled and started
  ansible.builtin.systemd:
    name: traefik
    enabled: true
    state: started

- name: Restart Traefik if config changed
  ansible.builtin.systemd:
    name: traefik
    state: restarted
  when: >
    traefik_static.changed or
    traefik_dynamic.changed or
    traefik_internal.changed or
    traefik_docker_routes.changed or
    traefik_service.changed
